<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes JS - Portafolio</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Marco principal -->
    <div class="marquesina-marco">
        <h1 class="titulo-portafolio">galería de imágenes interactiva</h1>
        <h2 class="nombre-alumno">Gutiérrez Padilla Christian Abdiel</h2>
        <h3 class="campus-subtitulo">Campus Guadalajara Sur</h3>

        <!-- Logo UVM -->
        <div class="contenedor-logo">
            <img id="imgLogo" class="logo-uvm" src="logotipo.jpg" alt="Logotipo UVM" onerror="this.style.display='none'; document.getElementById('svgLogo').style.display='block';">
            
            <svg id="svgLogo" class="logo-uvm" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="display: none;">
                <defs>
                    <linearGradient id="uvmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e51a24" />
                        <stop offset="100%" stop-color="#990000" />
                    </linearGradient>
                </defs>
                <circle cx="100" cy="100" r="95" fill="url(#uvmGrad)" />
                <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="4" />
                <g fill="#ffffff">
                    <path d="M 42 75 L 56 75 L 56 102 C 56 112 62 117 70 117 C 78 117 84 112 84 102 L 84 75 L 98 75 L 98 103 C 98 120 86 128 70 128 C 54 128 42 120 42 103 Z" />
                    <path d="M 94 75 L 108 75 L 118 110 L 128 75 L 142 75 L 126 126 L 110 126 Z" />
                    <path d="M 124 75 L 138 75 L 148 102 L 158 75 L 172 75 L 172 126 L 159 126 L 159 95 L 151 116 L 145 116 L 137 95 L 137 126 L 124 126 Z" />
                </g>
            </svg>
        </div>

        <!-- Cuadrícula de 6 imágenes de la carpeta img/ -->
        <div class="galeria-grid">
            <img src="img/imagen1.jpg" alt="Imagen 1" class="galeria-item">
            <img src="img/imagen2.jpg" alt="Imagen 2" class="galeria-item">
            <img src="img/imagen3.jpg" alt="Imagen 3" class="galeria-item">
            <img src="img/imagen4.jpg" alt="Imagen 4" class="galeria-item">
            <img src="img/imagen5.jpg" alt="Imagen 5" class="galeria-item">
            <img src="img/imagen6.jpg" alt="Imagen 6" class="galeria-item">
        </div>
    </div>

    <!-- Ventana Emergente Modal -->
    <div id="modalVentana" class="modal">
        <span class="cerrar-modal">&times;</span>
        <img class="modal-contenido" id="imagenModalSrc" alt="Vista ampliada">
    </div>

    <!-- Navegación de botones -->
    <div class="contenedor-botones">
        <a href="index.html" class="btn btn-azul">Volver a la Portada</a>
        <a href="marquesina.html" class="btn btn-verde">Ver Marquesina JS</a>
    </div>

    <!-- Enlace al script externo de galería -->
    <script src="galeria.js"></script>
</body>
</html>
